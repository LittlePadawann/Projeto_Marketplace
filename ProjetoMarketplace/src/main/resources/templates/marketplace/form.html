<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: menu}"></div>

<div class="container">
    <h2 class="mb-4" th:text="${marketplace.marketplaceId == null ? 'Novo Marketplace' : 'Editar Marketplace'}"></h2>

    <form th:action="@{/marketplaces/salvar}" th:object="${marketplace}" method="post" class="row g-3">
        <!-- Campo oculto essencial para manter o ID na edição -->
        <input type="hidden" th:field="*{marketplaceId}" />

        <div class="col-md-6">
            <label class="form-label">Nome do Marketplace</label>
            <input type="text" class="form-control" th:field="*{nomeMarketplace}" required />
        </div>
        <div class="col-md-6">
            <label class="form-label">Segmento</label>
            <input type="text" class="form-control" th:field="*{segmento}" required />
        </div>

        <div class="col-md-5">
            <label class="form-label">Cidade Sede</label>
            <input type="text" class="form-control" th:field="*{cidadeSede}" />
        </div>
        <div class="col-md-2">
            <label class="form-label">Estado (UF)</label>
            <input type="text" maxlength="2" class="form-control" th:field="*{estado}" />
        </div>
        <div class="col-md-5">
            <label class="form-label">Região</label>
            <input type="text" class="form-control" th:field="*{regiao}" />
        </div>

        <div class="col-md-3">
            <label class="form-label">Latitude</label>
            <input type="number" step="any" class="form-control" th:field="*{latitude}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Longitude</label>
            <input type="number" step="any" class="form-control" th:field="*{longitude}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Ano Fundação</label>
            <input type="number" class="form-control" th:field="*{anoFundacao}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Porte</label>
            <input type="text" class="form-control" th:field="*{porte}" />
        </div>

        <div class="col-md-4">
            <label class="form-label">Modelo de Negócio</label>
            <input type="text" class="form-control" th:field="*{modeloNegocio}" />
        </div>
        <div class="col-md-4">
            <label class="form-label">GMV Anual Estimado</label>
            <input type="number" step="0.01" class="form-control" th:field="*{gmvAnualEstimado}" />
        </div>
        <div class="col-md-4">
            <label class="form-label">Take Rate Médio (%)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{takeRateMedioPercentual}" />
        </div>

        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-success">Salvar</button>
            <a th:href="@{/marketplaces}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
