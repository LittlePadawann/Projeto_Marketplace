<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Pagamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: menu}"></div>

<div class="container">
    <h2 class="mb-4" th:text="${pagamento.pagamentoId == null ? 'Novo Pagamento' : 'Editar Pagamento'}"></h2>

    <form th:action="@{/pagamentos/salvar}" th:object="${pagamento}" method="post" class="row g-3">
        <input type="hidden" th:field="*{pagamentoId}" />

        <div class="col-md-6">
            <label class="form-label">Pedido</label>
            <select class="form-select" th:field="*{pedido.pedidoId}" required>
                <option value="">Selecione o pedido...</option>
                <option th:each="ped : ${pedidos}" th:value="${ped.pedidoId}" th:text="${'Pedido #' + ped.pedidoId + ' (R$ ' + ped.valorTotal + ')'}"></option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Cliente</label>
            <select class="form-select" th:field="*{cliente.clienteId}" required>
                <option value="">Selecione o cliente...</option>
                <option th:each="c : ${clientes}" th:value="${c.clienteId}" th:text="${'ID ' + c.clienteId + ' - ' + c.cidade}"></option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">Data do Pagamento</label>
            <input type="date" class="form-control" name="dataPagamento" th:value="${pagamento.dataPagamento}" required />
        </div>
        <div class="col-md-3">
            <label class="form-label">Valor Pago</label>
            <input type="number" step="0.01" class="form-control" th:field="*{valorPago}" required />
        </div>
        <div class="col-md-3">
            <label class="form-label">Forma de Pagamento</label>
            <input type="text" class="form-control" th:field="*{formaPagamento}" required />
        </div>
        <div class="col-md-3">
            <label class="form-label">Status</label>
            <input type="text" class="form-control" th:field="*{statusPagamento}" required />
        </div>

        <div class="col-md-4">
            <label class="form-label">Taxa de Processamento</label>
            <input type="number" step="0.01" class="form-control" th:field="*{taxaProcessamento}" />
        </div>
        <div class="col-md-4">
            <label class="form-label">Score Risco de Fraude</label>
            <input type="number" step="0.01" class="form-control" th:field="*{scoreRiscoFraude}" />
        </div>
        <div class="col-md-4 d-flex align-items-end">
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" th:field="*{fraudeConfirmada}" id="fraudeCheck" />
                <label class="form-check-label" for="fraudeCheck">Fraude Confirmada</label>
            </div>
        </div>

        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-success">Salvar</button>
            <a th:href="@{/pagamentos}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
