<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Pagamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: menu}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- Mensagens de Feedback (Sucesso / Erro de Vínculo) -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <h2>Pagamentos</h2>
        <a th:href="@{/pagamentos/novo}" class="btn btn-primary">+ Novo Pagamento</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Pedido</th>
                <th>Cliente</th>
                <th>Data</th>
                <th>Forma</th>
                <th>Valor Pago</th>
                <th>Status</th>
                <th>Fraude</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pag : ${pagamentos}">
                <td th:text="${pag.pagamentoId}"></td>
                <td th:text="${pag.pedido != null ? 'Pedido #' + pag.pedido.pedidoId : '-'}"></td>
                <td th:text="${pag.cliente != null ? 'Cliente #' + pag.cliente.clienteId : '-'}"></td>
                <td th:text="${pag.dataPagamento}"></td>
                <td th:text="${pag.formaPagamento}"></td>
                <td th:text="${#numbers.formatCurrency(pag.valorPago)}"></td>
                <td><span class="badge bg-secondary" th:text="${pag.statusPagamento}"></span></td>
                <td th:text="${pag.fraudeConfirmada != null && pag.fraudeConfirmada ? 'Sim' : 'Não'}"></td>
                <td class="text-end">
                    <a th:href="@{/pagamentos/editar/{id}(id=${pag.pagamentoId})}" class="btn btn-sm btn-outline-warning">Editar</a>
                    <a th:href="@{/pagamentos/excluir/{id}(id=${pag.pagamentoId})}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Deseja realmente excluir este pagamento?');">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
