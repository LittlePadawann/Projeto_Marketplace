<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: menu}"></div>

<div class="container">
    <h2 class="mb-4">Visão Geral da Operação</h2>

    <div class="row g-3">
        <div class="col-md-4">
            <div class="card border-primary h-100">
                <div class="card-body">
                    <h6 class="text-secondary text-uppercase">Marketplaces</h6>
                    <h2 class="display-5 fw-bold text-primary" th:text="${metricas.totalMarketplaces}">0</h2>
                    <a th:href="@{/marketplaces}" class="btn btn-sm btn-outline-primary mt-2">Gerenciar</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-success h-100">
                <div class="card-body">
                    <h6 class="text-secondary text-uppercase">Clientes Cadastrados</h6>
                    <h2 class="display-5 fw-bold text-success" th:text="${metricas.totalClientes}">0</h2>
                    <a th:href="@{/clientes}" class="btn btn-sm btn-outline-success mt-2">Gerenciar</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-info h-100">
                <div class="card-body">
                    <h6 class="text-secondary text-uppercase">Vendedores Ativos</h6>
                    <h2 class="display-5 fw-bold text-info" th:text="${metricas.totalVendedores}">0</h2>
                    <a th:href="@{/vendedores}" class="btn btn-sm btn-outline-info mt-2">Gerenciar</a>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card border-warning h-100">
                <div class="card-body">
                    <h6 class="text-secondary text-uppercase">Catálogo de Produtos</h6>
                    <h2 class="display-5 fw-bold text-warning" th:text="${metricas.totalProdutos}">0</h2>
                    <a th:href="@{/produtos}" class="btn btn-sm btn-outline-warning mt-2">Gerenciar</a>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card border-light h-100">
                <div class="card-body">
                    <h6 class="text-secondary text-uppercase">Pedidos Realizados</h6>
                    <h2 class="display-5 fw-bold" th:text="${metricas.totalPedidos}">0</h2>
                    <a th:href="@{/pedidos}" class="btn btn-sm btn-outline-light mt-2">Gerenciar</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
