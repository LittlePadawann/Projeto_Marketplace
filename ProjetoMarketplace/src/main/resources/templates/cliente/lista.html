<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: menu}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- Mensagens de Feedback (Sucesso / Erro de Vínculo) -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <h2>Clientes</h2>
        <a th:href="@{/clientes/novo}" class="btn btn-success">+ Novo Cliente</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Marketplace</th>
                <th>Cidade / UF</th>
                <th>Faixa Etária</th>
                <th>Canal Aquisição</th>
                <th>Status</th>
                <th>Score Churn</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.clienteId}"></td>
                <td th:text="${c.marketplace != null ? c.marketplace.nomeMarketplace : '-'}"></td>
                <td th:text="${c.cidade + ' - ' + c.estado}"></td>
                <td th:text="${c.faixaEtaria}"></td>
                <td th:text="${c.canalAquisicao}"></td>
                <td>
                    <span class="badge bg-secondary" th:text="${c.statusCliente}"></span>
                </td>
                <td th:text="${c.scoreChurn}"></td>
                <td class="text-end">
                    <a th:href="@{/clientes/editar/{id}(id=${c.clienteId})}" class="btn btn-sm btn-outline-warning">Editar</a>
                    <a th:href="@{/clientes/excluir/{id}(id=${c.clienteId})}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Deseja realmente excluir este cliente?');">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
