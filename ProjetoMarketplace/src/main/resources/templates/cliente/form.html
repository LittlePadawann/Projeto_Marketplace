<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: menu}"></div>

<div class="container">
    <h2 class="mb-4" th:text="${cliente.clienteId == null ? 'Novo Cliente' : 'Editar Cliente'}"></h2>

    <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post" class="row g-3">
        <input type="hidden" th:field="*{clienteId}" />

        <div class="col-md-6">
            <label class="form-label">Marketplace</label>
            <select class="form-select" th:field="*{marketplace.marketplaceId}" required>
                <option value="">Selecione um marketplace...</option>
                <option th:each="mk : ${marketplaces}"
                        th:value="${mk.marketplaceId}"
                        th:text="${mk.nomeMarketplace}"></option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Status do Cliente</label>
            <input type="text" class="form-control" th:field="*{statusCliente}" placeholder="Ex: Ativo, Inativo" required />
        </div>

        <div class="col-md-5">
            <label class="form-label">Cidade</label>
            <input type="text" class="form-control" th:field="*{cidade}" />
        </div>
        <div class="col-md-2">
            <label class="form-label">Estado (UF)</label>
            <input type="text" maxlength="2" class="form-control" th:field="*{estado}" />
        </div>
        <div class="col-md-5">
            <label class="form-label">Região</label>
            <input type="text" class="form-control" th:field="*{regiao}" />
        </div>

        <div class="col-md-3">
            <label class="form-label">Latitude</label>
            <input type="number" step="any" class="form-control" th:field="*{latitude}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Longitude</label>
            <input type="number" step="any" class="form-control" th:field="*{longitude}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Faixa Etária</label>
            <input type="text" class="form-control" th:field="*{faixaEtaria}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Faixa de Renda</label>
            <input type="text" class="form-control" th:field="*{faixaRenda}" />
        </div>

        <div class="col-md-3">
            <label class="form-label">Canal de Aquisição</label>
            <input type="text" class="form-control" th:field="*{canalAquisicao}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Data de Cadastro</label>
            <input type="date" class="form-control" name="dataCadastro" th:value="${cliente.dataCadastro}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Score Churn</label>
            <input type="number" step="0.01" class="form-control" th:field="*{scoreChurn}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Índice de Fidelidade</label>
            <input type="number" step="0.01" class="form-control" th:field="*{indiceFidelidade}" />
        </div>

        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-success">Salvar</button>
            <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
