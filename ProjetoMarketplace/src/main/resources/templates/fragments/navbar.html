<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/}">Marketplace Hub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Início</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/marketplaces}">Marketplaces</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/vendedores}">Vendedores</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/produtos}">Produtos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/pedidos}">Pedidos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/pagamentos}">Pagamentos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/logistica}">Logística</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/atendimentos}">Atendimento</a></li>
            </ul>

            <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                <span class="text-secondary small">
                    Olá, <strong class="text-light" sec:authentication="name">Usuário</strong>
                </span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Sair</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
