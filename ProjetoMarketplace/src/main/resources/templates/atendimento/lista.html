<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Atendimento e Satisfação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: menu}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- Mensagens de Feedback (Sucesso / Erro de Vínculo) -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <h2>Atendimento e Satisfação</h2>
        <a th:href="@{/atendimentos/novo}" class="btn btn-primary">+ Novo Atendimento</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Marketplace</th>
                <th>Data</th>
                <th>Canal</th>
                <th>Assunto</th>
                <th>Nota NPS</th>
                <th>Categoria NPS</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="at : ${atendimentos}">
                <td th:text="${at.atendimentoId}"></td>
                <td th:text="${at.cliente != null ? 'Cliente #' + at.cliente.clienteId : '-'}"></td>
                <td th:text="${at.marketplace != null ? at.marketplace.nomeMarketplace : '-'}"></td>
                <td th:text="${at.dataAtendimento}"></td>
                <td th:text="${at.canalAtendimento}"></td>
                <td th:text="${at.assunto}"></td>
                <td th:text="${at.notaNps}"></td>
                <td><span class="badge bg-secondary" th:text="${at.categoriaNps}"></span></td>
                <td class="text-end">
                    <a th:href="@{/atendimentos/editar/{id}(id=${at.atendimentoId})}" class="btn btn-sm btn-outline-warning">Editar</a>
                    <a th:href="@{/atendimentos/excluir/{id}(id=${at.atendimentoId})}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Deseja realmente excluir este atendimento?');">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
