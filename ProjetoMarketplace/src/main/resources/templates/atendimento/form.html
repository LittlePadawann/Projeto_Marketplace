<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Atendimento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: menu}"></div>

<div class="container">
    <h2 class="mb-4" th:text="${atendimento.atendimentoId == null ? 'Novo Atendimento' : 'Editar Atendimento'}"></h2>

    <form th:action="@{/atendimentos/salvar}" th:object="${atendimento}" method="post" class="row g-3">
        <input type="hidden" th:field="*{atendimentoId}" />

        <div class="col-md-6">
            <label class="form-label">Cliente</label>
            <select class="form-select" th:field="*{cliente.clienteId}" required>
                <option value="">Selecione o cliente...</option>
                <option th:each="c : ${clientes}" th:value="${c.clienteId}" th:text="${'ID ' + c.clienteId + ' - ' + c.cidade}"></option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Marketplace</label>
            <select class="form-select" th:field="*{marketplace.marketplaceId}" required>
                <option value="">Selecione o marketplace...</option>
                <option th:each="mk : ${marketplaces}" th:value="${mk.marketplaceId}" th:text="${mk.nomeMarketplace}"></option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Data do Atendimento</label>
            <input type="date" class="form-control" name="dataAtendimento" th:value="${atendimento.dataAtendimento}" required />
        </div>
        <div class="col-md-4">
            <label class="form-label">Canal</label>
            <input type="text" class="form-control" th:field="*{canalAtendimento}" required />
        </div>
        <div class="col-md-4">
            <label class="form-label">Assunto</label>
            <input type="text" class="form-control" th:field="*{assunto}" required />
        </div>

        <div class="col-md-3">
            <label class="form-label">Tempo de Atendimento (min)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{tempoAtendimentoMin}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Nota NPS (0-10)</label>
            <input type="number" class="form-control" th:field="*{notaNps}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Categoria NPS</label>
            <input type="text" class="form-control" th:field="*{categoriaNps}" placeholder="Promotor, Neutro, Detrator" />
        </div>
        <div class="col-md-3 d-flex align-items-end">
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" th:field="*{resolvidoPrimeiroContato}" id="fcrCheck" />
                <label class="form-check-label" for="fcrCheck">Resolvido no 1º Contato</label>
            </div>
        </div>

        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-success">Salvar</button>
            <a th:href="@{/atendimentos}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
