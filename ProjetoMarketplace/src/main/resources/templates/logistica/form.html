<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Logístico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: menu}"></div>

<div class="container">
    <h2 class="mb-4" th:text="${entrega.logisticaId == null ? 'Nova Entrega' : 'Editar Entrega'}"></h2>

    <form th:action="@{/logistica/salvar}" th:object="${entrega}" method="post" class="row g-3">
        <input type="hidden" th:field="*{logisticaId}" />

        <div class="col-md-6">
            <label class="form-label">Pedido</label>
            <select class="form-select" th:field="*{pedido.pedidoId}" required>
                <option value="">Selecione o pedido...</option>
                <option th:each="ped : ${pedidos}" th:value="${ped.pedidoId}" th:text="${'Pedido #' + ped.pedidoId}"></option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Marketplace</label>
            <select class="form-select" th:field="*{marketplace.marketplaceId}" required>
                <option value="">Selecione o marketplace...</option>
                <option th:each="mk : ${marketplaces}" th:value="${mk.marketplaceId}" th:text="${mk.nomeMarketplace}"></option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">Data de Envio</label>
            <input type="date" class="form-control" name="dataEnvio" th:value="${entrega.dataEnvio}" required />
        </div>
        <div class="col-md-3">
            <label class="form-label">Modalidade</label>
            <input type="text" class="form-control" th:field="*{modalidadeEntrega}" required />
        </div>
        <div class="col-md-3">
            <label class="form-label">Prazo Prometido (Dias)</label>
            <input type="number" class="form-control" th:field="*{prazoPrometidoDias}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Prazo Real (Dias)</label>
            <input type="number" class="form-control" th:field="*{prazoRealDias}" />
        </div>

        <div class="col-md-3">
            <label class="form-label">Custo Logístico</label>
            <input type="number" step="0.01" class="form-control" th:field="*{custoLogistico}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Score Risco de Atraso</label>
            <input type="number" step="0.01" class="form-control" th:field="*{scoreRiscoAtraso}" />
        </div>
        <div class="col-md-3 d-flex align-items-end">
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" th:field="*{entregaAtrasada}" id="atrasadaCheck" />
                <label class="form-check-label" for="atrasadaCheck">Entrega Atrasada</label>
            </div>
        </div>
        <div class="col-md-3 d-flex align-items-end">
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" th:field="*{devolucaoLogistica}" id="devolucaoCheck" />
                <label class="form-check-label" for="devolucaoCheck">Devolução Logística</label>
            </div>
        </div>

        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-success">Salvar</button>
            <a th:href="@{/logistica}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
