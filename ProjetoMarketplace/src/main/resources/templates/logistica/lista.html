<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Logística e Entregas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: menu}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- Mensagens de Feedback (Sucesso / Erro de Vínculo) -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <h2>Logística e Entregas</h2>
        <a th:href="@{/logistica/novo}" class="btn btn-primary">+ Nova Entrega</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Pedido</th>
                <th>Marketplace</th>
                <th>Data Envio</th>
                <th>Modalidade</th>
                <th>Prazo (Prom/Real)</th>
                <th>Atrasada</th>
                <th>Custo</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ent : ${entregas}">
                <td th:text="${ent.logisticaId}"></td>
                <td th:text="${ent.pedido != null ? 'Pedido #' + ent.pedido.pedidoId : '-'}"></td>
                <td th:text="${ent.marketplace != null ? ent.marketplace.nomeMarketplace : '-'}"></td>
                <td th:text="${ent.dataEnvio}"></td>
                <td th:text="${ent.modalidadeEntrega}"></td>
                <td th:text="${ent.prazoPrometidoDias + 'd / ' + ent.prazoRealDias + 'd'}"></td>
                <td th:text="${ent.entregaAtrasada != null && ent.entregaAtrasada ? 'Sim' : 'Não'}"></td>
                <td th:text="${#numbers.formatCurrency(ent.custoLogistico)}"></td>
                <td class="text-end">
                    <a th:href="@{/logistica/editar/{id}(id=${ent.logisticaId})}" class="btn btn-sm btn-outline-warning">Editar</a>
                    <a th:href="@{/logistica/excluir/{id}(id=${ent.logisticaId})}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Deseja realmente excluir este registro logístico?');">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
