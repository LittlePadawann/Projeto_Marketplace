<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Login - Marketplace Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-body-tertiary">

<div class="card shadow-lg border-secondary" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4">
        <h3 class="text-center fw-bold mb-1">Marketplace Hub</h3>
        <p class="text-center text-secondary mb-4">Acesso ao Sistema de Gestão</p>

        <div th:if="${param.erro}" class="alert alert-danger py-2 text-center">
            Usuário ou senha inválidos.
        </div>
        <div th:if="${param.logout}" class="alert alert-success py-2 text-center">
            Sessão encerrada com sucesso.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Usuário</label>
                <input type="text" name="username" class="form-control" placeholder="admin ou operador" required autofocus />
            </div>
            <div class="mb-4">
                <label class="form-label">Senha</label>
                <input type="password" name="password" class="form-control" placeholder="••••••" required />
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold">Entrar</button>
        </form>

        <div class="mt-4 pt-3 border-top border-secondary text-center small text-secondary">
            <div><strong>Admin:</strong> admin / 123456</div>
            <div><strong>Operador:</strong> operador / 123456</div>
        </div>
    </div>
</div>

</body>
</html>
