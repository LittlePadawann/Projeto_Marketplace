<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Vendedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: menu}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- Mensagens de Feedback (Sucesso / Erro de Vínculo) -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <h2>Vendedores</h2>
        <a th:href="@{/vendedores/novo}" class="btn btn-info text-dark fw-semibold">+ Novo Vendedor</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Marketplace</th>
                <th>Tipo</th>
                <th>Categoria Principal</th>
                <th>Cidade / UF</th>
                <th>Status</th>
                <th>Reputação</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${vendedores}">
                <td th:text="${v.vendedorId}"></td>
                <td th:text="${v.marketplace != null ? v.marketplace.nomeMarketplace : '-'}"></td>
                <td th:text="${v.tipoVendedor}"></td>
                <td th:text="${v.categoriaPrincipal}"></td>
                <td th:text="${v.cidade + ' - ' + v.estado}"></td>
                <td>
                    <span class="badge bg-secondary" th:text="${v.statusVendedor}"></span>
                </td>
                <td th:text="${v.reputacaoMedia}"></td>
                <td class="text-end">
                    <a th:href="@{/vendedores/editar/{id}(id=${v.vendedorId})}" class="btn btn-sm btn-outline-warning">Editar</a>
                    <a th:href="@{/vendedores/excluir/{id}(id=${v.vendedorId})}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Deseja realmente excluir este vendedor?');">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
