<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Vendedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: menu}"></div>

<div class="container">
    <h2 class="mb-4" th:text="${vendedor.vendedorId == null ? 'Novo Vendedor' : 'Editar Vendedor'}"></h2>

    <form th:action="@{/vendedores/salvar}" th:object="${vendedor}" method="post" class="row g-3">
        <input type="hidden" th:field="*{vendedorId}" />

        <div class="col-md-4">
            <label class="form-label">Marketplace</label>
            <select class="form-select" th:field="*{marketplace.marketplaceId}" required>
                <option value="">Selecione um marketplace...</option>
                <option th:each="mk : ${marketplaces}"
                        th:value="${mk.marketplaceId}"
                        th:text="${mk.nomeMarketplace}"></option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Tipo de Vendedor</label>
            <input type="text" class="form-control" th:field="*{tipoVendedor}" required />
        </div>
        <div class="col-md-4">
            <label class="form-label">Categoria Principal</label>
            <input type="text" class="form-control" th:field="*{categoriaPrincipal}" />
        </div>

        <div class="col-md-5">
            <label class="form-label">Cidade</label>
            <input type="text" class="form-control" th:field="*{cidade}" />
        </div>
        <div class="col-md-2">
            <label class="form-label">Estado (UF)</label>
            <input type="text" maxlength="2" class="form-control" th:field="*{estado}" />
        </div>
        <div class="col-md-5">
            <label class="form-label">Região</label>
            <input type="text" class="form-control" th:field="*{regiao}" />
        </div>

        <div class="col-md-3">
            <label class="form-label">Latitude</label>
            <input type="number" step="any" class="form-control" th:field="*{latitude}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Longitude</label>
            <input type="number" step="any" class="form-control" th:field="*{longitude}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Data de Entrada</label>
            <input type="date" class="form-control" name="dataEntrada" th:value="${vendedor.dataEntrada}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Status do Vendedor</label>
            <input type="text" class="form-control" th:field="*{statusVendedor}" />
        </div>

        <div class="col-md-6">
            <label class="form-label">Reputação Média</label>
            <input type="number" step="0.01" class="form-control" th:field="*{reputacaoMedia}" />
        </div>
        <div class="col-md-6">
            <label class="form-label">Score Risco de Suspensão</label>
            <input type="number" step="0.01" class="form-control" th:field="*{scoreRiscoSuspensao}" />
        </div>

        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-success">Salvar</button>
            <a th:href="@{/vendedores}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
