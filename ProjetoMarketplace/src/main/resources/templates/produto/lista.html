<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: menu}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- Mensagens de Feedback (Sucesso / Erro de Vínculo) -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <h2>Produtos</h2>
        <a th:href="@{/produtos/novo}" class="btn btn-warning text-dark fw-semibold">+ Novo Produto</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Marketplace</th>
                <th>Vendedor</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Status</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${produtos}">
                <td th:text="${p.produtoId}"></td>
                <td class="fw-semibold" th:text="${p.nomeProduto}"></td>
                <td th:text="${p.categoriaProduto}"></td>
                <td th:text="${p.marketplace != null ? p.marketplace.nomeMarketplace : '-'}"></td>
                <td th:text="${p.vendedor != null ? 'ID ' + p.vendedor.vendedorId + ' (' + p.vendedor.tipoVendedor + ')' : '-'}"></td>
                <td th:text="${#numbers.formatCurrency(p.precoProduto)}"></td>
                <td th:text="${p.estoqueAtual}"></td>
                <td>
                    <span class="badge bg-secondary" th:text="${p.statusProduto}"></span>
                </td>
                <td class="text-end">
                    <a th:href="@{/produtos/editar/{id}(id=${p.produtoId})}" class="btn btn-sm btn-outline-warning">Editar</a>
                    <a th:href="@{/produtos/excluir/{id}(id=${p.produtoId})}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Deseja realmente excluir este produto?');">Excluir</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
