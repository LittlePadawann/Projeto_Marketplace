<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: menu}"></div>

<div class="container">
    <h2 class="mb-4" th:text="${produto.produtoId == null ? 'Novo Produto' : 'Editar Produto'}"></h2>

    <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post" class="row g-3">
        <input type="hidden" th:field="*{produtoId}" />

        <div class="col-md-6">
            <label class="form-label">Marketplace</label>
            <select class="form-select" th:field="*{marketplace.marketplaceId}" required>
                <option value="">Selecione um marketplace...</option>
                <option th:each="mk : ${marketplaces}"
                        th:value="${mk.marketplaceId}"
                        th:text="${mk.nomeMarketplace}"></option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Vendedor</label>
            <select class="form-select" th:field="*{vendedor.vendedorId}" required>
                <option value="">Selecione um vendedor...</option>
                <option th:each="v : ${vendedores}"
                        th:value="${v.vendedorId}"
                        th:text="${'ID ' + v.vendedorId + ' - ' + v.tipoVendedor + ' (' + v.cidade + ')'}"></option>
            </select>
        </div>

        <div class="col-md-8">
            <label class="form-label">Nome do Produto</label>
            <input type="text" class="form-control" th:field="*{nomeProduto}" required />
        </div>
        <div class="col-md-4">
            <label class="form-label">Categoria</label>
            <input type="text" class="form-control" th:field="*{categoriaProduto}" required />
        </div>

        <div class="col-md-3">
            <label class="form-label">Preço (R$)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{precoProduto}" required />
        </div>
        <div class="col-md-3">
            <label class="form-label">Estoque Atual</label>
            <input type="number" class="form-control" th:field="*{estoqueAtual}" required />
        </div>
        <div class="col-md-3">
            <label class="form-label">Avaliação Média</label>
            <input type="number" step="0.01" class="form-control" th:field="*{avaliacaoMedia}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Status do Produto</label>
            <input type="text" class="form-control" th:field="*{statusProduto}" />
        </div>

        <div class="col-md-6">
            <label class="form-label">Margem Estimada (%)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{margemEstimadaPercentual}" />
        </div>
        <div class="col-md-6">
            <label class="form-label">Score Risco de Ruptura</label>
            <input type="number" step="0.01" class="form-control" th:field="*{scoreRiscoRuptura}" />
        </div>

        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-success">Salvar</button>
            <a th:href="@{/produtos}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
