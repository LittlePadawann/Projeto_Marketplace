<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: menu}"></div>

<div class="container">
    <h2 class="mb-4" th:text="${pedido.pedidoId == null ? 'Novo Pedido' : 'Editar Pedido'}"></h2>

    <form th:action="@{/pedidos/salvar}" th:object="${pedido}" method="post" class="row g-3">
        <input type="hidden" th:field="*{pedidoId}" />

        <div class="col-md-3">
            <label class="form-label">Marketplace</label>
            <select class="form-select" th:field="*{marketplace.marketplaceId}" required>
                <option value="">Selecione...</option>
                <option th:each="mk : ${marketplaces}" th:value="${mk.marketplaceId}" th:text="${mk.nomeMarketplace}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Cliente</label>
            <select class="form-select" th:field="*{cliente.clienteId}" required>
                <option value="">Selecione...</option>
                <option th:each="c : ${clientes}" th:value="${c.clienteId}" th:text="${'ID ' + c.clienteId + ' - ' + c.cidade}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Vendedor</label>
            <select class="form-select" th:field="*{vendedor.vendedorId}" required>
                <option value="">Selecione...</option>
                <option th:each="v : ${vendedores}" th:value="${v.vendedorId}" th:text="${'ID ' + v.vendedorId + ' - ' + v.tipoVendedor}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Produto</label>
            <select class="form-select" th:field="*{produto.produtoId}" required>
                <option value="">Selecione...</option>
                <option th:each="p : ${produtos}" th:value="${p.produtoId}" th:text="${p.nomeProduto}"></option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label">Data do Pedido</label>
            <input type="date" class="form-control" name="dataPedido" th:value="${pedido.dataPedido}" required />
        </div>
        <div class="col-md-3">
            <label class="form-label">Status do Pedido</label>
            <input type="text" class="form-control" th:field="*{statusPedido}" required />
        </div>
        <div class="col-md-3">
            <label class="form-label">Canal de Venda</label>
            <input type="text" class="form-control" th:field="*{canalVenda}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Quantidade de Itens</label>
            <input type="number" class="form-control" th:field="*{quantidadeItens}" required />
        </div>

        <div class="col-md-3">
            <label class="form-label">Valor dos Itens</label>
            <input type="number" step="0.01" class="form-control" th:field="*{valorItens}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Desconto</label>
            <input type="number" step="0.01" class="form-control" th:field="*{desconto}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Valor Frete</label>
            <input type="number" step="0.01" class="form-control" th:field="*{valorFrete}" />
        </div>
        <div class="col-md-3">
            <label class="form-label">Valor Total</label>
            <input type="number" step="0.01" class="form-control" th:field="*{valorTotal}" required />
        </div>

        <div class="col-md-4">
            <label class="form-label">Receita Comissão</label>
            <input type="number" step="0.01" class="form-control" th:field="*{receitaComissao}" />
        </div>
        <div class="col-md-4">
            <label class="form-label">Avaliação do Cliente (1-5)</label>
            <input type="number" class="form-control" th:field="*{avaliacaoCliente}" />
        </div>
        <div class="col-md-4">
            <label class="form-label">Probabilidade de Recompra</label>
            <input type="number" step="0.01" class="form-control" th:field="*{probabilidadeRecompra}" />
        </div>

        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-success">Salvar</button>
            <a th:href="@{/pedidos}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
